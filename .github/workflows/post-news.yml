name: Post Drama to Facebook

on:
  schedule:
    # Jadwal Short Drama: 12:00 & 18:00 WIB (UTC+7)
    #  12:00 WIB → 05:00 UTC
    #  18:00 WIB → 11:00 UTC
    - cron: '0 5,11 * * *'
  workflow_dispatch:

jobs:
  post-drama:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      - name: Create .env
        run: |
          cat >> .env << 'EOF'
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          GROQ_BASE_URL=${{ secrets.GROQ_BASE_URL }}
          OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
          AI_MODEL=${{ secrets.AI_MODEL }}
          FACEBOOK_PAGE_ID=${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_ACCESS_TOKEN=${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          POST_INTERVAL_HOURS=8
          MAX_POSTS_PER_RUN=6
          NEWS_SOURCE_URLS=https://www.dramabox.com/browse,https://www.moboreels.com/dramas,https://www.reelshort.com/shelf/new-release-short-movies-dramas-51001290
          IMAGE_WIDTH=800
          IMAGE_HEIGHT=1200
          IMAGE_STYLE=${{ secrets.IMAGE_STYLE }}
          EOF

      - run: npm start

      # Commit posted.json kembali ke repo sebagai persistensi dedup antar run.
      # Strategi ini lebih andal daripada actions/cache yang bisa hilang,
      # sehingga artikel yang sudah diposting tidak diposting ulang.
      - name: Commit dedup data
        run: |
          if [ -f data/posted.json ] && [ -n "$(git status --porcelain -- data/posted.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/posted.json
            git commit -m "chore: update dedup posted data [skip ci]"
            git push
          else
            echo "No changes to posted.json"
          fi
